name: CH5 D2 Linux short experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - configs/chapter5/d2_short_experiment_v1.json
      - .github/workflows/ch5-d2-linux.yml

permissions:
  contents: read

jobs:
  d2-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the pinned CPU environment
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run the paired M20 experiment
        run: bash scripts/ch5_linux.sh d2-short "outputs/chapter5/d2_linux_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" cpu
      - name: Save results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch5-d2-linux-results
          path: |
            outputs/chapter5/d2_linux_*/**
            !outputs/chapter5/d2_linux_*/**/*.pt
          if-no-files-found: warn
